[project]
name = "microflow"
version = "0.1.0"
description = "The irreducible AI agent workflow engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110.0", "uvicorn[standard]>=0.29.0", "sse-starlette>=1.8.2"]
dev = ["pytest>=8.0.0", "pytest-timeout>=2.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["microflow.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
